name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tested Node baseline
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install locked development dependencies
        run: make bootstrap
      - name: Check repository file hygiene
        run: make hooks-files-check
      - name: Run local project gates
        run: make check
      - name: Verify SQLite runtime and database settings
        run: make db
        env:
          DATABASE_URL: sqlite+pysqlite:///${{ runner.temp }}/math-tutor-ci/test.sqlite3
      - name: Run on-disk SQLite integration tests
        run: make test-integration
      - name: Install smoke-test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify built UI and API in a browser
        run: make smoke-built
      - name: Report synthetic browser failure context
        if: failure()
        run: |
          uv run --locked --no-env-file python - <<'PYTHON'
          from pathlib import Path
          for path in Path("test-results").glob("*/error-context.md"):
              print(path)
              print(path.read_text()[:20000])
          PYTHON
      - name: Evaluate original synthetic fixtures
        run: make eval-mock
      - name: Audit locked dependencies
        run: make audit

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the Compose deployment
        run: |
          trap 'rm -f .env' EXIT
          touch .env
          docker compose -f infra/docker/compose.yaml config --quiet
      - name: Build the non-root release container
        run: docker build -f infra/docker/Dockerfile -t math-practice-tutor:ci .
      - name: Verify the packaged API, UI and worker
        run: sh scripts/container-smoke.sh math-practice-tutor:ci
      - name: Scan the release container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: math-practice-tutor:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
      - name: Generate the release software bill of materials
        run: trivy image --format cyclonedx --output /tmp/math-tutor-sbom.json math-practice-tutor:ci
      - name: Retain the release software bill of materials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: /tmp/math-tutor-sbom.json
          if-no-files-found: error
          retention-days: 14
